name: Phase task
description: Track a focused implementation task from PLAN.md
title: "[Phase N] "
labels: ["type:feature"]
body:
  - type: dropdown
    id: track
    attributes:
      label: Track
      description: Which roadmap track does this task belong to?
      options:
        - Product track
        - Kernel-lab track
        - Docs/process only
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Phase
      description: Which PLAN.md phase does this belong to?
      placeholder: "Product Phase 1: Linux Product Foundation"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What real behavior should exist after this issue is complete?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What files, modules, or behavior are in scope?
      placeholder: |
        - Product area or kernel module:
        - CLI/service/shell command:
        - Docs:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What proves this works?
      placeholder: |
        - Product command or smoke test passes
        - Kernel-lab tasks still run make clean all iso when relevant
        - Docs and limitations are updated
    validations:
      required: true
  - type: textarea
    id: no_fake
    attributes:
      label: No-fake implementation check
      description: List any hardcoding, stubs, or unsupported behavior and how it will be avoided.
      placeholder: |
        - No hardcoded paths or secrets
        - Unsupported hardware fails safely
        - No fake success output
    validations:
      required: true

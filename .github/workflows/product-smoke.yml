name: Product Smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  product-smoke:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Show product status
        run: python3 product/cli/huggingos.py status --json

      - name: Run product doctor
        run: python3 product/cli/huggingos.py doctor --json

      - name: Run product smoke tests
        run: python3 -m unittest discover -s product/tests -p "test_*.py"

      - name: Run Rust agent tests
        run: cargo test
        working-directory: product/agent

      - name: Check Rust agent formatting
        run: cargo fmt -- --check
        working-directory: product/agent

      - name: Lint Rust agent
        run: cargo clippy -- -D warnings
        working-directory: product/agent

      - name: Show Rust AI runtime status
        run: cargo run -- ai status --json
        working-directory: product/agent

      - name: Plan through local AI runtime
        run: cargo run -- ai plan "show product status" --json
        working-directory: product/agent

      - name: Execute local AI plan through capabilities
        run: cargo run -- ai run "show product status" --json
        working-directory: product/agent

      - name: Show redacted AI secret readiness
        run: cargo run -- secrets status --json
        working-directory: product/agent

      - name: Show desktop readiness
        run: cargo run -- run desktop.status --json
        working-directory: product/agent

      - name: List desktop applications
        run: cargo run -- run apps.list --json
        working-directory: product/agent

      - name: Dry-run browser URL open
        run: cargo run -- run browser.open_url --param url=https://example.com --dry-run --json
        working-directory: product/agent

      - name: Preview workspace mode
        run: cargo run -- run workspace.mode.plan --param mode=coding --json
        working-directory: product/agent

      - name: Plan browser intent through AI runtime
        run: cargo run -- ai plan "open browser https://example.com" --json
        working-directory: product/agent

      - name: Run workspace intent through AI runtime
        run: cargo run -- ai run "switch to coding mode" --json
        working-directory: product/agent

      - name: Show screen and context readiness
        run: cargo run -- run screen.status --json
        working-directory: product/agent

      - name: Dry-run screenshot capture
        run: cargo run -- run screen.capture --dry-run --json
        working-directory: product/agent

      - name: Snapshot active context metadata
        run: cargo run -- run context.snapshot --confirm --json
        working-directory: product/agent

      - name: Dry-run OCR image request
        run: cargo run -- run screen.ocr_image --param path=../../README.md --dry-run --json
        working-directory: product/agent

      - name: Plan screen context intent through AI runtime
        run: cargo run -- ai plan "what is open" --json
        working-directory: product/agent

      - name: Run screen context intent through AI runtime
        run: cargo run -- ai run "what is open" --confirm --json
        working-directory: product/agent

      - name: Plan screenshot intent through AI runtime
        run: cargo run -- ai plan "take a screenshot" --json
        working-directory: product/agent

      - name: Store session memory
        run: cargo run -- run memory.session.remember --param key=current-goal --param value=phase-six-seven --json
        working-directory: product/agent

      - name: List session memory
        run: cargo run -- run memory.session.list --json
        working-directory: product/agent

      - name: Store preference memory
        run: cargo run -- run memory.preference.set --param key=theme --param value=dark --json
        working-directory: product/agent

      - name: Build semantic file index
        run: cargo run -- run files.semantic.index --param root=../../docs --confirm --json
        working-directory: product/agent

      - name: Search semantic file index
        run: cargo run -- run files.semantic.search --param query=capability --json
        working-directory: product/agent

      - name: Build workspace resume plan
        run: cargo run -- run workspace.resume.plan --json
        working-directory: product/agent

      - name: Show agent catalog
        run: cargo run -- run agents.catalog --json
        working-directory: product/agent

      - name: Plan multi-agent delegation
        run: cargo run -- run agents.plan --param "goal=daily brief" --json
        working-directory: product/agent

      - name: Run multi-agent orchestration
        run: cargo run -- run agents.orchestrate --param "goal=daily brief" --confirm --json
        working-directory: product/agent

      - name: List multi-agent traces
        run: cargo run -- run agents.trace.list --json
        working-directory: product/agent

      - name: Plan Phase 6 memory intent through AI runtime
        run: cargo run -- ai plan "resume my workspace" --json
        working-directory: product/agent

      - name: Plan Phase 7 agent intent through AI runtime
        run: cargo run -- ai plan "daily brief" --json
        working-directory: product/agent

      - name: Detect repeated workflows
        run: cargo run -- run proactive.workflow.detect --json
        working-directory: product/agent

      - name: Build proactive suggestions
        run: cargo run -- run proactive.suggest --json
        working-directory: product/agent

      - name: Diagnose simulated app failure
        run: cargo run -- run selfheal.diagnose --param symptom=app_crashed --param target=editor --param simulated=true --json
        working-directory: product/agent

      - name: Explain recent activity timeline
        run: cargo run -- run timeline.explain --json
        working-directory: product/agent

      - name: Plan Phase 8 workflow intent through AI runtime
        run: cargo run -- ai plan "detect repeated workflow" --json
        working-directory: product/agent

      - name: Plan Phase 8 healing intent through AI runtime
        run: cargo run -- ai plan "app crashed, self heal it" --json
        working-directory: product/agent

      - name: Validate sample plugin manifest
        run: cargo run -- run plugins.validate --param source=../plugins/hello-assistant --json
        working-directory: product/agent

      - name: Verify sample plugin package signature
        run: cargo run -- run plugins.package.validate --param source=../plugins/hello-assistant --json
        working-directory: product/agent

      - name: Review sample plugin permissions
        run: cargo run -- run plugins.permission.review --param source=../plugins/hello-assistant --json
        working-directory: product/agent

      - name: Install sample plugin
        run: cargo run -- run plugins.install --param source=../plugins/hello-assistant --param force=true --confirm --json
        working-directory: product/agent

      - name: List installed plugins
        run: cargo run -- run plugins.catalog --json
        working-directory: product/agent

      - name: Plan sample plugin workflow
        run: cargo run -- run plugins.workflow.plan --param plugin_id=sample.hello --json
        working-directory: product/agent

      - name: Run sample plugin capability
        run: cargo run -- run plugins.capability.run --param plugin_id=sample.hello --param capability=hello --json
        working-directory: product/agent

      - name: Plan Phase 9 plugin intent through AI runtime
        run: cargo run -- ai plan "list plugins" --json
        working-directory: product/agent

      - name: Disable sample plugin
        run: cargo run -- run plugins.disable --param plugin_id=sample.hello --confirm --json
        working-directory: product/agent

      - name: Remove sample plugin
        run: cargo run -- run plugins.remove --param plugin_id=sample.hello --confirm --json
        working-directory: product/agent

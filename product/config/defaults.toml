[product]
name = "huggingOS"
version = "0.4.0-phase4"
track = "product"
phase = "Product Phase 4"
base_strategy = "Ubuntu LTS hosted prototype"

[runtime]
app_id = "huggingos"
config_env = "HUGGINGOS_CONFIG_FILE"
state_dir_env = "HUGGINGOS_STATE_DIR"
workspace_dir_env = "HUGGINGOS_WORKSPACE_DIR"

[ai]
default_provider = "local.rules"
provider_env = "HUGGINGOS_AI_PROVIDER"
offline_env = "HUGGINGOS_AI_OFFLINE"
offline_mode = true
openai_api_key_env = "HUGGINGOS_OPENAI_API_KEY"
anthropic_api_key_env = "HUGGINGOS_ANTHROPIC_API_KEY"
local_model_endpoint_env = "HUGGINGOS_LOCAL_MODEL_ENDPOINT"

[features]
cloud_ai_enabled = false
desktop_control_enabled = true
browser_control_enabled = false
desktop_overlay_enabled = false
memory_index_enabled = false
workspace_modes_enabled = true

[policy]
audit_log_name = "audit.log"
confirmation_required_for = [
  "delete",
  "overwrite",
  "shell",
  "network",
  "browser",
  "secret",
  "system",
]

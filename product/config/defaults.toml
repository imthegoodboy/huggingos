[product]
name = "huggingOS"
version = "0.11.0-phase11"
track = "product"
phase = "Product Phase 11"
base_strategy = "Ubuntu LTS hosted prototype"

[runtime]
app_id = "huggingos"
config_env = "HUGGINGOS_CONFIG_FILE"
state_dir_env = "HUGGINGOS_STATE_DIR"
workspace_dir_env = "HUGGINGOS_WORKSPACE_DIR"

[ai]
default_provider = "local.rules"
provider_env = "HUGGINGOS_AI_PROVIDER"
offline_env = "HUGGINGOS_AI_OFFLINE"
offline_mode = true
openai_api_key_env = "HUGGINGOS_OPENAI_API_KEY"
anthropic_api_key_env = "HUGGINGOS_ANTHROPIC_API_KEY"
local_model_endpoint_env = "HUGGINGOS_LOCAL_MODEL_ENDPOINT"

[privacy]
private_title_markers = [
  "password",
  "secret",
  "token",
  "credential",
  "private",
  "incognito",
  "bank",
  "vault",
  "2fa",
  "otp",
]
private_app_markers = [
  "password",
  "secret",
  "credential",
  "vault",
  "bank",
]
max_context_text_chars = 240

[features]
cloud_ai_enabled = false
desktop_control_enabled = true
browser_control_enabled = false
desktop_overlay_enabled = false
memory_index_enabled = true
workspace_modes_enabled = true
screen_context_enabled = true
screen_capture_enabled = true
privacy_exclusions_enabled = true
ocr_enabled = false
session_memory_enabled = true
preference_memory_enabled = true
semantic_file_search_enabled = true
multi_agent_orchestration_enabled = true
predictive_suggestions_enabled = true
self_healing_diagnostics_enabled = true
timeline_explain_enabled = true
plugin_sdk_enabled = true
declarative_plugins_enabled = true
plugin_package_trust_enabled = true
plugin_permission_review_enabled = true
plugin_signature_verification_enabled = true

[policy]
audit_log_name = "audit.log"
confirmation_required_for = [
  "delete",
  "overwrite",
  "shell",
  "network",
  "browser",
  "secret",
  "system",
]
